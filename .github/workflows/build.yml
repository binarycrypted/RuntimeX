name: Build RuntimeX
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Theos
        uses: Randomblock1/theos-action@v1
      - name: Build Package
        run: |
          ls -la
          make package FINALPACKAGE=1
      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: RuntimeX-deb
          path: packages/*.deb
